[workspace]
resolver = "3"
members = ["crates/potpot-controls", "crates/potpot-window", "crates/potpot", "xtask"]

[workspace.package]
license = "MIT OR Apache-2.0"

# each crate takes these with `[lints] workspace = true`
[workspace.lints.rust]
missing_docs = "warn"
missing_debug_implementations = "warn"

[workspace.dependencies]
potpot-controls = { path = "crates/potpot-controls" }
wgpu = { version = "27", default-features = false, features = ["std", "wgsl"] }

# the window copies every pixel of a frame on the cpu, which an unoptimized build is too slow
# at to follow a drag in a large window
[profile.dev]
opt-level = 1
