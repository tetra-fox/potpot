[workspace]
resolver = "3"
members = ["crates/potpot-controls", "crates/potpot-window", "crates/potpot"]

[workspace.package]
license = "MIT OR Apache-2.0"

# each crate takes these with `[lints] workspace = true`
[workspace.lints.rust]
missing_docs = "warn"
missing_debug_implementations = "warn"

[workspace.dependencies]
potpot-controls = { path = "crates/potpot-controls" }
wgpu = { version = "27", default-features = false, features = ["std", "wgsl"] }
