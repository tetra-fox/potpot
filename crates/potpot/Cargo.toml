[package]
name = "potpot"
version = "0.1.0"
edition = "2024"
description = "a small lit 3d scene renderer on wgpu, for skeuomorphic plugin panels"
license = "GPL-3.0-or-later"
publish = false

[dependencies]
bytemuck = { version = "1", features = ["derive"] }
# the strokes of the face its lettering is in
potpot-controls.workspace = true
glam = { version = "0.30", features = ["bytemuck"] }
wgpu.workspace = true

[dev-dependencies]
# turns the shaders into what each graphics api is given, to see that it can be done on any
# machine. the version wgpu itself is on
naga = { version = "27", features = ["hlsl-out", "msl-out", "spv-out", "wgsl-in"] }
png = "0.18"
# the window the demo opens. without the plugin wrapper, which a window of its own has no use for
potpot-window = { path = "../potpot-window", default-features = false }
pollster = "0.4"
wgpu = { workspace = true, features = ["vulkan"] }
