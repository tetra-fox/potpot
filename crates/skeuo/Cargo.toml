[package]
name = "skeuo"
version = "0.1.0"
edition = "2024"
description = "a small lit 3d scene renderer on wgpu, for skeuomorphic plugin panels"
license = "GPL-3.0-or-later"
publish = false

[dependencies]
bytemuck = { version = "1", features = ["derive"] }
glam = { version = "0.30", features = ["bytemuck"] }
wgpu.workspace = true

[dev-dependencies]
png = "0.18"
pollster = "0.4"
wgpu = { workspace = true, features = ["vulkan"] }
